name: YashFit Quality & Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test, Security & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Static Type Check
        run: npm run typecheck

      - name: ESLint Verification
        run: npm run lint

      - name: Run Vitest (Unit, Integration & Security)
        run: npm run test:vitest

      - name: Run Legacy Engine Test Suites
        run: npm run test:legacy

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"

      - name: Run Playwright End-to-End & Responsive Tests
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

